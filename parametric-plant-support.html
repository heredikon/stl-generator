<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parametric Plant Support Stand</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Google Fonts for premium typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Import Maps for Three.js and plugins -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "three-csg-ts": "https://esm.sh/three-csg-ts@3.1.11?deps=three@0.160.0"
            }
        }
    </script>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar Controls -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="index.html" class="back-link">← Back to Home</a>
                <h1>Plant Support Stand</h1>
                <p>Adjust ring and stackable stake parameters to generate your 3D model.</p>
            </div>

            <div class="controls-container">
                <!-- Ring Dimensions -->
                <div class="control-group">
                    <h3>Ring Dimensions</h3>
                    <div class="control-row">
                        <label for="innerDiameter">Inner Diameter D (mm)</label>
                        <input type="number" id="innerDiameter" value="90" min="30" max="300" step="1">
                    </div>
                    <div class="control-row">
                        <label for="ringWidth">Band Width T (mm)</label>
                        <input type="number" id="ringWidth" value="14" min="6" max="40" step="0.5">
                    </div>
                    <div class="control-row">
                        <label for="ringHeight">Ring Height rh (mm)</label>
                        <input type="number" id="ringHeight" value="6" min="2" max="30" step="0.5">
                    </div>
                    <div class="control-row">
                        <label for="openingAngle">Opening Angle O (°)</label>
                        <input type="number" id="openingAngle" value="45" min="15" max="120" step="1">
                    </div>
                </div>

                <!-- Stakes & Click-Fit -->
                <div class="control-group">
                    <h3>Click-Fit Stakes & Slots</h3>
                    <div class="control-row">
                        <label for="stakeHeight">Stake Height h (mm)</label>
                        <input type="number" id="stakeHeight" value="120" min="40" max="300" step="1">
                    </div>
                    <div class="control-row">
                        <label for="slotSize">Slot / Shaft Width l (mm)</label>
                        <input type="number" id="slotSize" value="7" min="4" max="25" step="0.5">
                    </div>
                    <div class="control-row">
                        <label for="tipLength">Spike Tip Length (mm)</label>
                        <input type="number" id="tipLength" value="22" min="10" max="60" step="1">
                    </div>
                    <div class="control-row">
                        <label for="snapAllowance">Click Snap Ridge (mm)</label>
                        <input type="number" id="snapAllowance" value="0.6" min="0.2" max="1.5" step="0.1">
                    </div>
                    <div class="control-row">
                        <label for="fitClearance">Click Fit Clearance (mm)</label>
                        <input type="number" id="fitClearance" value="0.2" min="0.05" max="0.6" step="0.05">
                    </div>
                </div>
            </div>

            <div class="actions">
                <button id="btn-generate" class="btn primary">Generate Model</button>
                <div style="display: flex; gap: 8px;">
                    <button id="btn-download-ring" class="btn secondary" style="flex: 1; font-size: 0.82rem; padding: 12px 6px;">Ring STL</button>
                    <button id="btn-download-stakes" class="btn secondary" style="flex: 1; font-size: 0.82rem; padding: 12px 6px;">3 Stakes STL</button>
                    <button id="btn-download-single-stake" class="btn secondary" style="flex: 1; font-size: 0.82rem; padding: 12px 6px;">1 Stake STL</button>
                </div>
            </div>
        </aside>

        <!-- 3D Viewer Area -->
        <main class="viewer-area">
            <div id="loading" class="loading-overlay">
                <div class="spinner"></div>
                <p>Generating Geometry...</p>
            </div>
            <div id="canvas-container"></div>
        </main>
    </div>

    <!-- Application Logic -->
    <script type="module" src="js/plant-support.js"></script>
</body>

</html>
